services:
  postgres:
    image: postgres:16-alpine
    container_name: smdl-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: smdl
      POSTGRES_PASSWORD: smdl
      POSTGRES_DB: smdl
    volumes:
      - smdl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdl -d smdl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smdl_pg_data:
